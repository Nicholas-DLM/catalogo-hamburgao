<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self';
        style-src 'self';
        connect-src 'self'
            https://docs.google.com
            https://*.googleusercontent.com;
        img-src 'self'
            data:
            https://i.ibb.co
            https://images.openfoodfacts.org
            https://world.openfoodfacts.org
            https://placehold.co;
        object-src 'none';
        frame-src 'none';
        base-uri 'self';
        form-action 'self';
    "
>
    <title>Hamburgão da Lapa & Mercado</title>

    <link
    rel="icon"
    type="image/png"
    href="imagens/logo-hamburgao.png"
>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="marca-topo">
    <img
        src="imagens/logo-hamburgao.png"
        alt="Logo Hamburgão da Lapa"
        class="logo-site"
    >

    <div class="nome-site">
        Para seu NEGÓCIO ou para sua CASA
    </div>
</div>
        
        <input
            type="search"
            id="busca"
            placeholder="🔎 Pesquisar produtos..."
            autocomplete="off"
                >
        <div class="categorias" id="categorias-container">
            <!-- Categorias renderizadas via JS -->
        </div>
    </header>

    <main>
        <h2 id="titulo-secao">Todos os Produtos</h2>
        <div class="produtos-grid" id="produtos-grid">
            <!-- Produtos renderizados via JS -->
        </div>
    </main>

    <!-- Botão Flutuante do Carrinho -->
    <button
            type="button"
            id="btn-carrinho"
            class="btn-carrinho-flutuante"
>        🛒 Carrinho (<span id="contador-carrinho">0</span>)
    </button>

    <!-- Modal do Carrinho -->
        <div
            id="modal-carrinho"
            class="modal hidden"
            role="dialog"
            aria-modal="true"
            aria-labelledby="titulo-carrinho"
        >
        <div class="modal-content">
            
            <button
            type="button"
            id="btn-fechar-carrinho"
            class="close"
            aria-label="Fechar carrinho"
        >
            &times;
            </button>
            <h2 id="titulo-carrinho">Seu Pedido</h2>
            <div id="itens-carrinho"></div>
            <div class="total-carrinho">
                <strong>Total: </strong> <span id="valor-total">R$ 0,00</span>
            </div>
            <button
                type="button"
                id="btn-whatsapp"
                class="btn-whatsapp"
            >
                Enviar pedido pelo WhatsApp
            </button>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
